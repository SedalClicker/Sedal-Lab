<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SE:DAL 주문 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx-populate/1.21.0/xlsx-populate.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2621;--sub:#7a7066;--line:#e4ddd3;--accent:#1f5c3c;--warn:#b0202a;--warnbg:#fbeaea;--okbg:#e8f2ea;--chip:#efe9e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
#sync{font-size:12px;color:#cfc6bb}
#sync.warn{color:#ffb4b4}
#sync.ok{color:#9fd8b0}
.form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.form input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;min-width:220px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:transparent;color:#cfc6bb;border:0;padding:6px 12px;border-radius:6px;font-size:14px;cursor:pointer}
nav button.on{background:#fff;color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.bar input[type=password],.bar input[type=search],.bar input[type=number]{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.msg{color:var(--sub);font-size:13px}
.msg.err{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips b{font-weight:600;margin-left:4px}
.order{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.order.cancel{opacity:.55}
.ohead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:#fcfaf7}
.ohead .who{font-weight:600;font-size:15px}
.ohead .meta{color:var(--sub);font-size:12px}
.ohead label{margin-left:auto}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--sub);white-space:nowrap}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.ok{background:var(--okbg);color:var(--accent)}
.line{display:flex;gap:12px;padding:10px 12px;border-top:1px dashed var(--line);flex-wrap:wrap}
.line:first-of-type{border-top:0}
.line .info{flex:1;min-width:220px}
.line .pname{font-weight:600}
.line .opt{color:var(--sub);font-size:13px;word-break:break-all}
.line.addon{padding-top:4px;padding-bottom:4px;background:#fcfaf7}
.line.addon .pname{font-weight:400;font-size:13px}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;white-space:nowrap}
.check input{width:18px;height:18px;margin:0}
.check.done{background:var(--okbg);border-color:#bcd9c3;color:var(--accent)}
.stages{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-start}
.sheet{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,64px);gap:4px;padding:6px;border-radius:10px}
.cell{border-radius:7px;height:46px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.2;border:1px solid rgba(0,0,0,.12);text-align:center}
.cell .acc{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.cell .no{position:absolute;top:2px;left:4px;font-size:9px;opacity:.6}
.spec{font-size:13px}
.spec div{margin-bottom:2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.2)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
section.inv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:auto}
section.inv h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;font-size:13px}
th,td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td input{width:62px;border:1px solid var(--line);border-radius:5px;padding:4px;text-align:right;font-size:13px}
td input.min{width:48px;color:var(--sub)}
td .need{display:block;font-size:11px;color:var(--sub)}
td.short input{border-color:var(--warn);background:var(--warnbg)}
td.short .need{color:var(--warn);font-weight:600}
td.low input{border-color:#e0a03a}
.hint{color:var(--sub);font-size:12px;margin:4px 0 8px}
@media (max-width:600px){main{padding:10px}.ohead label{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>SE:DAL 주문 관리</h1>
  <span id="sync"></span>
  <nav>
    <button data-tab="orders" class="on">주문</button>
    <button data-tab="inv">재고</button>
    <button data-tab="settings">설정</button>
  </nav>
</header>
<main>
  <div id="tab-orders">
    <div class="bar">
      <input type="file" id="file" accept=".xlsx">
      <input type="password" id="pw" placeholder="엑셀 비밀번호" autocomplete="off" size="12">
      <button class="btn primary" id="load">불러오기</button>
      <span class="msg" id="load-msg"></span>
    </div>
    <div class="bar">
      <div class="chips" id="filters"></div>
      <input type="search" id="q" placeholder="이름 · 주문번호 · 코드 검색" style="margin-left:auto;min-width:200px">
      <label class="msg"><input type="checkbox" id="show-cancel"> 취소 포함</label>
    </div>
    <div class="msg" id="dec-msg" style="margin:0 0 8px 4px"></div>
    <div id="list"></div>
  </div>
  <div id="tab-inv" hidden></div>
  <div id="tab-settings" hidden>
    <section class="inv">
      <h2>재고 차감 설정</h2>
      <p class="hint">커스텀 클리커 1개를 생산 완료로 체크할 때 빠지는 자석 개수예요. 자석 없음 주문은 빼지 않아요.</p>
      <label>클리커 1개당 자석 <input type="number" id="set-magnet" min="0" style="width:60px"> 개</label>
    </section>
    <section class="inv">
      <h2>여러 기기에서 쓰기 (Supabase 동기화)</h2>
      <p class="hint">Supabase 에 연결하고 로그인하면 체크와 재고가 클라우드에 저장돼서, PC와 휴대폰 어디서 열어도 같은 내용이 보여요. 연결 정보는 이 브라우저에만 저장되고 GitHub 에는 올라가지 않아요.</p>
      <div id="cloud-cfg">
        <div class="form"><input id="cl-url" placeholder="Project URL (https://xxxx.supabase.co)"></div>
        <div class="form"><input id="cl-key" placeholder="anon public key (eyJ… 또는 sb_publishable_…)"><button class="btn" id="cl-save">연결 저장</button></div>
      </div>
      <div id="cloud-login" hidden>
        <div class="form"><input id="cl-email" type="email" placeholder="이메일" autocomplete="username"></div>
        <div class="form"><input id="cl-pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btn primary" id="cl-login">로그인</button></div>
      </div>
      <div id="cloud-on" hidden>
        <p><span id="cl-who"></span> <button class="btn" id="cl-sync">지금 동기화</button> <button class="btn" id="cl-logout">로그아웃</button></p>
      </div>
      <p class="msg" id="cl-msg"></p>
      <p><button class="btn" id="cl-reset" style="font-size:12px">연결 정보 지우기</button></p>
    </section>
    <section class="inv">
      <h2>백업</h2>
      <p class="hint">동기화를 쓰지 않으면 데이터는 이 브라우저에만 저장돼요. 보관용으로 가끔 백업 파일을 내려받아 두세요.</p>
      <button class="btn" id="backup">백업 내려받기</button>
      <label class="btn">백업 불러오기 <input type="file" id="restore" accept=".json" hidden></label>
      <button class="btn" id="wipe" style="color:var(--warn)">모든 데이터 지우기</button>
    </section>
  </div>
</main>
<script>
const CHECK_URL = 'https://sedalclicker.github.io/Sedal-Lab/check.html';
const STORE_KEY = 'sedal-orders-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- 저장소 ----
let DB = load();
function load() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (v && v.orders) return Object.assign(emptyDB(), v);
  } catch (e) {}
  return emptyDB();
}
function emptyDB() { return {orders: {}, inv: {}, fixes: {}, settings: {magnet: 1}}; }
function save() {
  saveLocal();
  cloudTouch();
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { alert('저장 공간이 부족해 저장하지 못했어요. 백업 후 오래된 데이터를 정리해 주세요.'); }
}

// ---- 클라우드 동기화 (Supabase) ----
// 데이터를 항목 하나씩 kv 표의 한 줄(key → value)로 저장해요. 바뀐 항목만 올리니까
// 두 기기가 서로 다른 주문을 체크해도 덮어쓰지 않아요.
const CLOUD_CFG = 'sedal-orders-cloud', CLOUD_DIRTY = 'sedal-orders-dirty', CLOUD_LINKED = 'sedal-orders-linked';
let cloud = null, cloudReady = false, channel = null, pushTimer = null, pushing = false;
let snap = {};    // 클라우드에 있다고 알고 있는 값 (key → 정렬된 JSON)
let dirty = new Set(readJSON(CLOUD_DIRTY, []));    // 아직 못 올린 항목
function readJSON(k, d) { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch (e) { return d; } }
// jsonb 는 키 순서를 바꿔 저장하므로 비교할 때는 키를 정렬한 JSON 을 써요
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}
function flat(db) {
  const m = {settings: db.settings};
  for (const [k, v] of Object.entries(db.orders)) m['order:' + k] = v;
  for (const [k, v] of Object.entries(db.inv)) m['inv:' + k] = v;
  for (const [k, v] of Object.entries(db.fixes)) m['fix:' + k] = v;
  return m;
}
function putKey(db, key, val) {
  if (key === 'settings') { if (val) db.settings = Object.assign({magnet: 1}, val); return; }
  const i = key.indexOf(':'), box = {order: db.orders, inv: db.inv, fix: db.fixes}[key.slice(0, i)];
  if (!box) return;
  if (val === undefined) delete box[key.slice(i + 1)]; else box[key.slice(i + 1)] = val;
}
function setSync(text, cls = '') { const s = $('#sync'); s.textContent = text; s.className = cls; }
const saveDirty = () => localStorage.setItem(CLOUD_DIRTY, JSON.stringify([...dirty]));

function cloudTouch() {
  if (!cloudReady) return;
  const f = flat(DB);
  for (const k of Object.keys(f)) if (canon(f[k]) !== snap[k]) dirty.add(k);
  for (const k of Object.keys(snap)) if (!(k in f)) dirty.add(k);
  saveDirty();
  if (dirty.size) { setSync('저장 중…'); clearTimeout(pushTimer); pushTimer = setTimeout(push, 600); }
}

async function push() {
  if (!cloud || pushing || !dirty.size) return;
  pushing = true;
  let ok = false;
  const keys = [...dirty], f = flat(DB), sent = {};
  try {
    const ups = keys.filter(k => k in f).map(k => { sent[k] = canon(f[k]); return {key: k, value: f[k], updated_at: new Date().toISOString()}; });
    const dels = keys.filter(k => !(k in f));
    for (let i = 0; i < ups.length; i += 500) {
      const {error} = await cloud.from('kv').upsert(ups.slice(i, i + 500));
      if (error) throw error;
    }
    for (let i = 0; i < dels.length; i += 200) {
      const {error} = await cloud.from('kv').delete().in('key', dels.slice(i, i + 200));
      if (error) throw error;
    }
    const now = flat(DB);
    for (const k of keys) {
      if (k in sent) snap[k] = sent[k]; else delete snap[k];
      // 올리는 사이에 또 바뀐 항목은 다음 번에 다시 올려요
      if ((k in now ? canon(now[k]) : undefined) === snap[k]) dirty.delete(k);
    }
    saveDirty();
    setSync(dirty.size ? '저장 중…' : '동기화됨', dirty.size ? '' : 'ok');
    ok = true;
  } catch (e) {
    setSync('클라우드 저장 실패 · 다시 시도 중', 'warn');
    console.error(e);
    clearTimeout(pushTimer); pushTimer = setTimeout(push, 15000);
  } finally {
    pushing = false;
  }
  if (ok && dirty.size) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 600); }
}

async function pull() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const {data, error} = await cloud.from('kv').select('key,value').order('key').range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  const local = flat(DB), fresh = emptyDB();
  snap = {};
  for (const r of rows) { putKey(fresh, r.key, r.value); snap[r.key] = canon(r.value); }
  // 처음 연결하는 기기는 클라우드에 없는 이 기기의 항목을 합쳐서 올려요
  const firstLink = !localStorage.getItem(CLOUD_LINKED);
  if (firstLink) for (const k of Object.keys(local)) if (!(k in snap)) dirty.add(k);
  // 아직 못 올린 이 기기의 변경은 클라우드 값보다 우선해요
  for (const k of dirty) putKey(fresh, k, k in local ? local[k] : undefined);
  DB = fresh;
  saveLocal(); saveDirty();
  localStorage.setItem(CLOUD_LINKED, '1');
  render();
}

function subscribe() {
  if (channel) cloud.removeChannel(channel);
  channel = cloud.channel('kv-changes')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'kv'}, p => {
      const key = (p.new && p.new.key) || (p.old && p.old.key);
      if (!key || dirty.has(key)) return;
      if (p.eventType === 'DELETE') { putKey(DB, key, undefined); delete snap[key]; }
      else { const c = canon(p.new.value); if (c === snap[key]) return; putKey(DB, key, p.new.value); snap[key] = c; }
      saveLocal();
      clearTimeout(subscribe.t); subscribe.t = setTimeout(render, 300);
    })
    .subscribe();
}

async function cloudStart() {
  cloudReady = false;
  const cfg = readJSON(CLOUD_CFG, null);
  if (!cfg || !window.supabase) { cloud = null; setSync(''); renderCloud(); return; }
  cloud = cloud || supabase.createClient(cfg.url, cfg.key);
  const {data} = await cloud.auth.getSession();
  if (!data.session) { setSync('클라우드 로그인 필요', 'warn'); renderCloud(); return; }
  setSync('동기화 중…');
  try {
    await pull();
    cloudReady = true;
    subscribe();
    cloudTouch();
    if (!dirty.size) setSync('동기화됨', 'ok');
  } catch (e) {
    console.error(e);
    setSync('클라우드 연결 실패', 'warn');
    $('#cl-msg').textContent = '연결 실패: ' + (e.message || e) + ' (URL·키·kv 표를 확인해 주세요)';
  }
  renderCloud();
}

async function renderCloud() {
  const cfg = readJSON(CLOUD_CFG, null);
  const session = cloud ? (await cloud.auth.getSession()).data.session : null;
  $('#cloud-cfg').hidden = !!cfg;
  $('#cloud-login').hidden = !cfg || !!session;
  $('#cloud-on').hidden = !session;
  $('#cl-reset').hidden = !cfg;
  if (session) $('#cl-who').textContent = `${session.user.email} 로 로그인됨`;
}

$('#cl-save').onclick = () => {
  const url = $('#cl-url').value.trim().replace(/\/+$/, ''), key = $('#cl-key').value.trim();
  if (!/^https:\/\/.+/.test(url) || key.length < 20) { $('#cl-msg').textContent = 'Project URL 과 anon key 를 확인해 주세요'; return; }
  localStorage.setItem(CLOUD_CFG, JSON.stringify({url, key}));
  cloud = null; $('#cl-msg').textContent = '저장했어요. 이제 로그인해 주세요.';
  cloudStart();
};
$('#cl-login').onclick = async () => {
  if (!cloud) { $('#cl-msg').textContent = 'Supabase 라이브러리를 불러오지 못했어요. 새로고침해 주세요.'; return; }
  $('#cl-msg').textContent = '로그인 중…';
  const {error} = await cloud.auth.signInWithPassword({email: $('#cl-email').value.trim(), password: $('#cl-pw').value});
  $('#cl-pw').value = '';
  if (error) { $('#cl-msg').textContent = '로그인 실패: ' + error.message; return; }
  $('#cl-msg').textContent = '';
  cloudStart();
};
$('#cl-logout').onclick = async () => {
  await push();
  if (channel) cloud.removeChannel(channel);
  channel = null; cloudReady = false;
  await cloud.auth.signOut();
  setSync('클라우드 로그인 필요', 'warn'); renderCloud();
};
$('#cl-sync').onclick = () => cloudStart();
$('#cl-reset').onclick = async () => {
  if (!confirm('이 브라우저의 Supabase 연결 정보를 지울까요? (데이터는 지워지지 않아요)')) return;
  if (cloud) { if (channel) cloud.removeChannel(channel); await cloud.auth.signOut(); }
  [CLOUD_CFG, CLOUD_DIRTY, CLOUD_LINKED].forEach(k => localStorage.removeItem(k));
  cloud = null; channel = null; cloudReady = false; dirty = new Set(); snap = {};
  setSync(''); renderCloud();
};
// 다른 기기에서 바꾼 내용을 화면으로 돌아올 때 다시 받아요 (실시간 연결이 끊겼을 때 대비)
document.addEventListener('visibilitychange', () => { if (!document.hidden && cloudReady) pull().catch(console.error); });

// ---- 커스텀 코드 해석기 (check.html 을 숨은 iframe 으로 불러와 그 함수를 그대로 사용) ----
let DEC = null, CAT = null;
const decCache = {};
async function loadDecoder() {
  $('#dec-msg').textContent = '커스텀 코드 해석기를 불러오는 중…';
  try {
    let html = await (await fetch(CHECK_URL, {cache: 'no-cache'})).text();
    html = html.replace(/<script[^>]*gc\.zgo\.at[^>]*><\/script>/gi, '')
      .replace(/<head>/i, `<head><base href="${CHECK_URL}">`)
      .replace(/<\/body>/i, `<script>
window.__cat=()=>({colors:COLORS.map(c=>({id:c.id,name:c.name,hex:c.hex,only:c.only||null,nobody:!!c.nobody})),shapes:SHAPES.map(s=>({k:s.k,name:s.name,acc:!!s.acc})),sw:SW.map(s=>({id:s.id,name:swName(s.id),type:s.type,hex:s.hex})),rims:Object.entries(RIMS).map(([k,r])=>({k,name:r.name,hex:r.hex}))});
window.__dec=raw=>{const r=parseCode(raw);const code=extractCode(raw);if(r.err)return{err:r.err,code};const keep=S;try{S={...structuredClone(S),...structuredClone(r.st),acc:Array(8).fill(null),step:'done',sel:0};
return{code,body:S.body,rim:S.rim||null,logo:S.logo||null,nomag:!!S.nomag,btn:S.btn.map((id,i)=>({shp:S.shp[i],color:id,acc:SH[S.shp[i]].acc?accOf(i):null,sw:S.sw[i]})),price:total(),breakdown:breakdown().replace(/<[^>]+>/g,'')}}finally{S=keep}};
<\/script></body>`);
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:absolute;width:400px;height:400px;left:-9999px;top:0;border:0';
    fr.setAttribute('aria-hidden', 'true');
    document.body.appendChild(fr);
    await new Promise((ok, bad) => { fr.onload = ok; fr.onerror = bad; fr.srcdoc = html; });
    DEC = fr.contentWindow.__dec;
    CAT = fr.contentWindow.__cat();
    if (!DEC || !CAT) throw new Error('해석 함수를 찾지 못했어요');
    $('#dec-msg').textContent = '';
  } catch (e) {
    $('#dec-msg').innerHTML = `<span class="msg err">커스텀 코드 해석기를 불러오지 못했어요 (${esc(e.message)}). 새로고침해 보세요.</span>`;

const color = id => CAT && CAT.colors.find(c => c.id === id) || {name: id, hex: '#ddd'};
const shape = k => CAT && CAT.shapes.find(s => s.k === k) || {name: k};
const swOf = id => CAT && CAT.sw.find(s => s.id === id) || {name: id, hex: '#ddd'};
const rimOf = k => CAT && CAT.rims.find(r => r.k === k) || {name: k, hex: '#ddd'};

// ---- 엑셀 불러오기 ----
$('#load').onclick = async () => {
  const f = $('#file').files[0], msg = $('#load-msg');
  msg.className = 'msg';
  if (!f) { msg.className = 'msg err'; msg.textContent = '엑셀 파일을 먼저 골라 주세요'; return; }
  msg.textContent = '여는 중… (비밀번호가 있으면 몇 초 걸려요)';
  try {
    let buf = await f.arrayBuffer();
    const pw = $('#pw').value;
    // 비밀번호 걸린 엑셀은 OLE 컨테이너(D0 CF 11 E0)로 저장돼요. 풀어서 일반 xlsx 로 바꾼 뒤 읽어요
    const head = new Uint8Array(buf.slice(0, 4));
    if (head[0] === 0xD0 && head[1] === 0xCF && head[2] === 0x11 && head[3] === 0xE0) {
      if (!pw) throw new Error('비밀번호가 걸린 파일이에요. 비밀번호를 입력해 주세요');
      try { buf = await (await XlsxPopulate.fromDataAsync(buf, {password: pw})).outputAsync('arraybuffer'); }
      catch (e) { throw new Error('비밀번호가 맞지 않아요'); }
    }
    const wb = XLSX.read(buf, {type: 'array'});
    const rowsOf = name => XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null});
    if (wb.Sheets['코드 보완 목록']) {
      const n = importFixes(rowsOf('코드 보완 목록'));
      msg.textContent = `완료: 보정 코드 ${n}건 반영`;
    } else {
      const res = importRows(rowsOf(wb.SheetNames[0]));
      msg.textContent = `완료: 새 주문 ${res.added}줄, 갱신 ${res.updated}줄`;
    }
    $('#pw').value = '';
    render();
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = e.message;
  }
};

const SHIPPED_STATES = ['배송중', '배송완료', '구매확정'];
function importRows(rows) {
  const head = rows[0].map(h => String(h || '').trim());
  const need = ['상품주문번호', '주문번호', '상품명', '옵션정보', '수량'];
  const miss = need.filter(h => !head.includes(h));
  if (miss.length) throw new Error('스마트스토어 주문 엑셀이 아닌 것 같아요 (없는 열: ' + miss.join(', ') + ')');
  let added = 0, updated = 0;
  const now = new Date().toISOString();
  for (const r of rows.slice(1)) {
    const d = {};
    head.forEach((h, i) => d[h] = r[i]);
    if (!d['상품주문번호']) continue;
    const id = String(d['상품주문번호']);
    let at = d['주문일시'];
    if (typeof at === 'number') {
      // 엑셀 날짜 숫자를 한국 시간 그대로 읽어요 (SheetJS 날짜 변환은 초 단위가 어긋나요)
      const u = new Date(Math.round((at - 25569) * 864e5));
      at = new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes(), u.getUTCSeconds()).toISOString();
    }
    const row = {
      id, orderNo: String(d['주문번호']), at: at || '', status: d['주문상태'] || '', claim: d['클레임상태'] || '',
      product: d['상품명'] || '', option: d['옵션정보'] || '', qty: Number(d['수량']) || 1,
      buyer: d['구매자명'] || '', buyerId: d['구매자ID'] || '', receiver: d['수취인명'] || ''
    };
    const old = DB.orders[id];
    if (old) { Object.assign(old, row); updated++; }
    else {
      const done = SHIPPED_STATES.includes(row.status);
      // 이 프로그램을 쓰기 전에 이미 발송된 주문은 모든 단계 완료로 두고 재고는 건드리지 않아요
      DB.orders[id] = Object.assign(row, {stages: done ? {body: true, btn: true, asm: true, pack: true} : {}, shipped: done, imported: done, deducted: null, firstSeen: now});
      added++;
    }
  }
  save();
  return {added, updated};
}

// 스마트스토어 옵션 칸은 20자에서 잘려서, 긴 코드는 고객에게 다시 받은 전체 코드로 바꿔 써요
function importFixes(rows) {
  const head = rows[0].map(h => String(h || '').trim());
  const iId = head.indexOf('상품주문번호');
  const iCode = head.findIndex(h => h.startsWith('전체 코드'));
  if (iId < 0 || iCode < 0) throw new Error('"코드 보완 목록" 시트에 상품주문번호 / 전체 코드 열이 없어요');
  let n = 0;
  for (const r of rows.slice(1)) {
    if (!r[iId] || !r[iCode]) continue;
    DB.fixes[String(r[iId])] = String(r[iCode]).trim();
    n++;
  }
  save();
  return n;
}

// ---- 상품 분류와 부품 계산 ----
function kindOf(l) {
  const p = l.product, o = l.option;
  if (/커스텀/.test(p) && /코드/.test(o)) return 'custom';
  if (/^버튼 변경/.test(o)) return 'addShape';
  if (/^테두리 추가/.test(o)) return 'addRim';
  if (/버튼 별도/.test(p)) return 'btnSet';
  if (/테두리 별도/.test(p)) return 'rimSet';
  return 'other';
}
const isAddon = l => ['addShape', 'addRim'].includes(kindOf(l));
const isCancel = l => l.status === '취소' || /취소/.test(l.claim || '');
const rawCodeOf = l => { const o = String(l.option); return o.slice(o.indexOf(':') + 1).trim(); };
const codeOf = l => DB.fixes[l.id] || rawCodeOf(l);
const STAGES = [['body', '본체출력'], ['btn', '버튼출력'], ['asm', '조립'], ['pack', '포장']];
const stagesOf = l => kindOf(l) === 'custom' ? STAGES : [['asm', '생산'], ['pack', '포장']];
const st = l => l.stages || (l.stages = {});
function opts(o) {
  const m = {};
  String(o || '').split(' / ').forEach(p => { const i = p.indexOf(':'); if (i > 0) m[p.slice(0, i).trim()] = p.slice(i + 1).trim(); });
  return m;
}
const ALIAS = {'검정': '블랙', '검은색': '블랙', '흰색': '화이트', '하양': '화이트', '초콜릿': '초코', '딸기': '스트로베리', '민트': '메론'};
function colorByName(n) {
  if (!CAT || !n) return null;
  n = String(n).replace(/\s/g, '');
  n = ALIAS[n] || n;
  const c = CAT.colors.find(c => c.name === n);
  return c ? c.id : null;
}
const rimByName = n => CAT && (CAT.rims.find(r => r.name === String(n).replace(/\s/g, '')) || {}).k || null;

// 주문 한 줄을 만드는 데 드는 부품 {부품키: 개수}. 계산할 수 없으면 {err}
function recipe(l) {
  const k = kindOf(l), q = l.qty, out = {};
  const add = (key, n) => out[key] = (out[key] || 0) + n * q;
  if (k === 'custom') {
    const d = decode(codeOf(l));
    if (!d) return {pending: true};
    if (d.err) return {err: '코드 오류'};
    add('body:' + d.body, 1);
    if (d.rim) add('rim:' + d.rim, 1);
    d.btn.forEach(b => {
      add(`btn:${b.shp}:${b.color}`, 1);
      if (b.acc) add(`acc:${b.shp}:${b.acc}`, 1);
      add('sw:' + b.sw, 1);
    });
    if (!d.nomag && DB.settings.magnet > 0) add('etc:magnet', DB.settings.magnet);
    return {parts: out};
  }
  if (k === 'btnSet') {
    const o = opts(l.option), c = colorByName(o['컬러입력'] || o['컬러']);
    if (!c) return {err: '색상 이름 확인 필요'};
    add(`btn:${/무지/.test(o['버튼 종류'] || '') ? 'P' : 'B'}:${c}`, 1);
    return {parts: out};
  }
  if (k === 'rimSet') {
    const r = rimByName(opts(l.option)['컬러']);
    if (!r) return {err: '테두리 색 확인 필요'};
    add('rim:' + r, 1);
    return {parts: out};
  }
  return {none: true};
}

function partName(key) {
  const [t, a, b] = key.split(':');
  if (t === 'body') return `본체 ${color(a).name}`;
  if (t === 'btn') return `${shape(a).name} 버튼 ${color(b).name}`;
  if (t === 'acc') return `${shape(a).name} 장식 ${color(b).name}`;
  if (t === 'rim') return `테두리 ${rimOf(a).name}`;
  if (t === 'sw') return swOf(a).name;
  if (key === 'etc:magnet') return '자석';
  return (DB.inv[key] && DB.inv[key].name) || key;
}
const invQty = k => (DB.inv[k] && Number(DB.inv[k].qty)) || 0;
function applyParts(parts, sign) {
  for (const [k, n] of Object.entries(parts)) {
    DB.inv[k] = DB.inv[k] || {qty: 0};
    DB.inv[k].qty = invQty(k) + sign * n;
  }
}

// ---- 주문 묶음 ----
function groups() {
  const g = {};
  for (const l of Object.values(DB.orders)) (g[l.orderNo] = g[l.orderNo] || []).push(l);
  return Object.entries(g).map(([no, lines]) => {
    lines.sort((a, b) => isAddon(a) - isAddon(b) || a.id.localeCompare(b.id));
    const live = lines.filter(l => !isCancel(l));
    const mains = live.filter(l => !isAddon(l));
    const o = {no, lines, live, mains, at: lines[0].at, receiver: lines[0].receiver, buyer: lines[0].buyer,
      cancelled: !live.length, shipped: live.length > 0 && live.every(l => l.shipped)};
    o.produced = mains.every(l => st(l).pack);
    o.issues = issuesOf(o);
    o.stage = o.cancelled ? 'cancel' : o.shipped ? 'done' : o.produced ? 'ship' : 'make';
    return o;
  }).sort((a, b) => String(a.at).localeCompare(String(b.at)));
}

// 코드 오류, 그리고 결제한 추가 옵션(하트·별·링·테두리)과 코드 내용이 다른 경우
function issuesOf(o) {
  const out = [];
  const customs = o.live.filter(l => kindOf(l) === 'custom');
  if (!customs.length || !DEC) return out;
  const cnt = {H: 0, S: 0, R: 0, rim: 0}, rims = new Set();
  for (const l of customs) {
    const d = decode(codeOf(l));
    if (d.err) { out.push(`코드 오류: ${d.err}`); return out; }
    d.btn.forEach(b => cnt[b.shp] !== undefined && (cnt[b.shp] += l.qty));
    if (d.rim) { cnt.rim += l.qty; rims.add(rimOf(d.rim).name); }
  }
  const paid = {H: 0, S: 0, R: 0, rim: 0}, paidRims = new Set();
  let oldStyle = false;
  for (const l of o.live) {
    if (kindOf(l) === 'addShape') {
      const v = opts(l.option)['버튼 변경'] || l.product;
      const k = /하트/.test(v) ? 'H' : /별/.test(v) ? 'S' : /링/.test(v) ? 'R' : null;
      if (k) paid[k] += l.qty;
    } else if (kindOf(l) === 'addRim') {
      paid.rim += l.qty;
      paidRims.add(opts(l.option)['테두리 추가'] === '초콜릿' ? '초코' : opts(l.option)['테두리 추가']);
    } else if (kindOf(l) === 'custom' && /버튼모양/.test(l.option)) oldStyle = true;
  }
  if (oldStyle) return out;
  const nm = {H: '하트', S: '별', R: '링', rim: '테두리'};
  for (const k of ['H', 'S', 'R', 'rim']) {
    if (cnt[k] !== paid[k]) out.push(`${nm[k]}: 코드 ${cnt[k]}개 / 결제 ${paid[k]}개`);
  }
  if (cnt.rim && paid.rim && [...rims].some(r => !paidRims.has(r))) out.push(`테두리 색: 코드 ${[...rims].join(', ')} / 결제 ${[...paidRims].join(', ')}`);
  return out;
}

// ---- 화면: 주문 ----
let filter = 'make';
const FILTERS = [['make', '생산 대기'], ['ship', '발송 대기'], ['issue', '확인 필요'], ['done', '완료'], ['all', '전체']];
function render() {
  if (!$('#tab-inv').hidden) return renderInv();
  const gs = groups(), showCancel = $('#show-cancel').checked;
  const q = $('#q').value.trim().toLowerCase();
  const visible = gs.filter(o => showCancel || !o.cancelled);
  const count = f => visible.filter(o => match(o, f)).length;
  $('#filters').innerHTML = FILTERS.map(([k, n]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${n}<b>${count(k)}</b></button>`).join('');
  const list = visible.filter(o => match(o, filter)).filter(o => !q || JSON.stringify(o.lines).toLowerCase().includes(q));
  $('#list').innerHTML = list.length ? list.map(orderHTML).join('')
    : `<div class="empty">${Object.keys(DB.orders).length ? '해당하는 주문이 없어요' : '스마트스토어에서 내려받은 주문 엑셀을 불러와 주세요'}</div>`;
}
function match(o, f) {
  if (f === 'all') return true;
  if (f === 'issue') return o.issues.length > 0 && !o.cancelled;
  return o.stage === f;
}
const fmtAt = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

function orderHTML(o) {
  const st = [...new Set(o.lines.map(l => l.status))].map(s => `<span class="badge ${SHIPPED_STATES.includes(s) ? 'ok' : s === '취소' ? 'warn' : ''}">${esc(s)}</span>`).join(' ');
  const who = o.receiver && o.receiver !== o.buyer ? `${esc(o.receiver)} <span class="meta">(구매 ${esc(o.buyer)})</span>` : esc(o.buyer || o.receiver);
  return `<div class="order ${o.cancelled ? 'cancel' : ''}">
    <div class="ohead">
      <span class="who">${who}</span>
      <span class="meta">${fmtAt(o.at)} · 주문 ${esc(o.no)}</span> ${st}
      ${o.issues.map(i => `<span class="badge warn">${esc(i)}</span>`).join(' ')}
      ${o.cancelled ? '' : `<label class="check ${o.shipped ? 'done' : ''}"><input type="checkbox" data-ship="${esc(o.no)}" ${o.shipped ? 'checked' : ''}> 발송 완료</label>`}
    </div>
    ${o.lines.map(lineHTML).join('')}
  </div>`;
}

function lineHTML(l) {
  const k = kindOf(l), cancel = isCancel(l);
  if (isAddon(l)) {
    return `<div class="line addon"><div class="info"><span class="pname">+ ${esc(l.option)}</span> × ${l.qty} ${cancel ? '<span class="badge warn">취소</span>' : ''}</div></div>`;
  }
  let body = '';
  if (k === 'custom') body = customHTML(l);
  else body = `<div class="opt">${esc(l.option)}</div>`;
  const rc = recipe(l);
  const note = rc.err ? `<span class="badge warn">재고 차감 불가: ${esc(rc.err)}</span>` : rc.none ? '<span class="badge">재고 차감 없음</span>' : '';
  return `<div class="line">
    <div class="info">
      <div><span class="pname">${esc(l.product)}</span> × ${l.qty} ${cancel ? '<span class="badge warn">취소</span>' : ''} ${note} ${l.imported ? '<span class="badge">불러올 때 이미 발송됨</span>' : ''}</div>
      ${body}
    </div>
    ${cancel ? '' : `<div class="stages">${stagesOf(l).map(([k, n]) => `<label class="check ${st(l)[k] ? 'done' : ''}"><input type="checkbox" data-line="${esc(l.id)}" data-stage="${k}" ${st(l)[k] ? 'checked' : ''}> ${n}</label>`).join('')}</div>`}
  </div>`;
}

function customHTML(l) {
  const raw = codeOf(l), d = decode(raw);
  if (!d) return `<div class="opt">코드 ${esc(raw)} · 해석기 준비 중</div>`;
  const fixed = DB.fixes[l.id] ? `<div class="opt">스토어 기재 코드 ${esc(rawCodeOf(l))} → 보정 코드 사용 <button class="btn" style="padding:1px 8px;font-size:12px" data-unfix="${esc(l.id)}">되돌리기</button></div>` : '';
  if (d.err) return `${fixed}<div class="opt">코드 <b>${esc(raw)}</b></div><div class="warnbox">${esc(d.err)} — 고객에게 받은 전체 코드를 넣어 주세요
    <div style="margin-top:6px;display:flex;gap:6px"><input data-fixin="${esc(l.id)}" placeholder="전체 코드" style="flex:1;border:1px solid var(--line);border-radius:5px;padding:5px"><button class="btn" data-fix="${esc(l.id)}">적용</button></div></div>`;
  const body = color(d.body);
  const cells = d.btn.map((b, i) => {
    const c = color(b.color), s = swOf(b.sw);
    const dark = parseInt(c.hex.slice(1, 3), 16) * .3 + parseInt(c.hex.slice(3, 5), 16) * .59 + parseInt(c.hex.slice(5, 7), 16) * .11 < 120;
    return `<div class="cell" style="background:${c.hex};color:${dark ? '#fff' : '#2b2621'}" title="${esc(shape(b.shp).name)} · ${esc(c.name)}${b.acc ? ' · 장식 ' + esc(color(b.acc).name) : ''} · ${esc(s.name)}">
      <span class="no">${i + 1}</span>${b.acc ? `<span class="acc" style="background:${color(b.acc).hex}"></span>` : ''}
      <b>${esc(shape(b.shp).name.replace('형', ''))}</b>${esc(s.name.replace('축', ''))}</div>`;
  }).join('');
  const tally = {};
  d.btn.forEach(b => tally[b.sw] = (tally[b.sw] || 0) + 1);
  return `${fixed}<div class="opt">코드 <b>${esc(d.code)}</b> · ${Number(d.price).toLocaleString()}원</div>
    <div class="sheet">
      <div class="grid" style="background:${body.hex}">${cells}</div>
      <div class="spec">
        <div><span class="sw" style="background:${body.hex}"></span>본체 <b>${esc(body.name)}</b></div>
        ${d.rim ? `<div><span class="sw" style="background:${rimOf(d.rim).hex}"></span>테두리 <b>${esc(rimOf(d.rim).name)}</b></div>` : ''}
        <div>로고 ${d.logo ? `<b>${esc(color(d.logo).name)}</b>` : '본체색'}</div>
        ${d.nomag ? '<div><b>자석 없음</b></div>' : ''}
        <div>축 ${Object.entries(tally).map(([id, n]) => `<span class="sw" style="background:${swOf(id).hex}"></span>${esc(swOf(id).name)} ${n}`).join(' · ')}</div>
        <div class="msg">${esc(d.breakdown)}</div>
      </div>
    </div>`;
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.stage) {
    const l = DB.orders[t.dataset.line], k = t.dataset.stage;
    st(l)[k] = t.checked;
    // 조립(커스텀 외 상품은 "생산") 단계에서 부품이 재고에서 빠지고, 체크를 풀면 돌아와요
    if (k === 'asm') {
      if (t.checked && !l.deducted && !l.imported) {
        const rc = recipe(l);
        if (rc.parts) { applyParts(rc.parts, -1); l.deducted = rc.parts; }
      } else if (!t.checked) {
        if (l.deducted) applyParts(l.deducted, +1);
        l.deducted = null; l.imported = false;
      }
    }
    save(); render();
  } else if (t.dataset.ship) {
    for (const l of Object.values(DB.orders)) if (l.orderNo === t.dataset.ship && !isCancel(l)) { l.shipped = t.checked; l.shippedAt = t.checked ? new Date().toISOString() : null; }
    save(); render();
  } else if (t.dataset.inv) {
    const k = t.dataset.inv;
    DB.inv[k] = DB.inv[k] || {qty: 0};
    DB.inv[k][t.dataset.field] = t.value === '' ? (t.dataset.field === 'qty' ? 0 : null) : Number(t.value);
    save(); renderInv();
  } else if (t.id === 'show-cancel') render();
});
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.fix) {
    const v = document.querySelector(`[data-fixin="${t.dataset.fix}"]`).value.trim();
    if (!v) return;
    const d = DEC && DEC(v);
    if (d && d.err) { alert('이 코드도 해석되지 않아요: ' + d.err); return; }
    DB.fixes[t.dataset.fix] = v; save(); render();
  } else if (t.dataset.unfix) {
    delete DB.fixes[t.dataset.unfix]; save(); render();
  }
});
$('#q').oninput = render;
$('#filters').onclick = e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.f; render(); } };

// ---- 화면: 재고 ----
function needs() {
  const n = {};
  for (const l of Object.values(DB.orders)) {
    if (st(l).asm || isCancel(l) || isAddon(l)) continue;
    const rc = recipe(l);
    if (rc.parts) for (const [k, v] of Object.entries(rc.parts)) n[k] = (n[k] || 0) + v;
  }
  return n;
}
function invCell(k, need) {
  const qty = invQty(k), min = DB.inv[k] && DB.inv[k].min, nd = need[k] || 0;
  const cls = qty < nd ? 'short' : (min != null && qty - nd < min) ? 'low' : '';
  return `<td class="${cls}"><input type="number" data-inv="${k}" data-field="qty" value="${qty}">${nd ? `<span class="need">필요 ${nd}</span>` : ''}</td>`;
}
function minCell(k) {
  const m = DB.inv[k] && DB.inv[k].min;
  return `<td><input class="min" type="number" data-inv="${k}" data-field="min" value="${m ?? ''}" placeholder="-"></td>`;
}
function renderInv() {
  const el = $('#tab-inv');
  if (!CAT) { el.innerHTML = '<div class="empty">커스텀 코드 해석기를 불러온 뒤에 재고 목록이 나타나요</div>'; return; }
  const need = needs();
  const short = Object.entries(need).filter(([k, n]) => invQty(k) < n);
  const accShapes = CAT.shapes.filter(s => s.acc);
  const btnColors = CAT.colors, bodyColors = CAT.colors.filter(c => !c.only && !c.nobody);
  const row = (k, label, hex) => `<tr><td>${hex ? `<span class="sw" style="background:${hex}"></span>` : ''}${esc(label)}</td>${invCell(k, need)}${minCell(k)}</tr>`;
  const extra = Object.keys(DB.inv).filter(k => k.startsWith('etc:') && k !== 'etc:magnet');
  el.innerHTML = `
    <div class="bar">
      ${short.length ? `<span class="badge warn">미생산 주문 기준 부족 ${short.length}종</span> <span class="msg">${short.slice(0, 8).map(([k, n]) => `${esc(partName(k))} ${n - invQty(k)}개`).join(', ')}${short.length > 8 ? ' …' : ''}</span>`
        : '<span class="badge ok">미생산 주문을 만들 재고가 모두 있어요</span>'}
    </div>
    <p class="hint">숫자 칸은 현재 재고예요. "필요"는 아직 생산하지 않은 주문에 드는 수량이고, 모자라면 빨간색이에요. 생산 완료를 체크하면 재고에서 자동으로 빠지고, 체크를 풀면 돌아와요. 작은 회색 칸은 최소 보유량이에요 (밑으로 떨어지면 주황색).</p>
    <section class="inv"><h2>버튼 (모양 × 색)</h2>
      <table><tr><th>색</th>${CAT.shapes.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr>
      ${btnColors.map(c => `<tr><td><span class="sw" style="background:${c.hex}"></span>${esc(c.name)}</td>${CAT.shapes.map(s => invCell(`btn:${s.k}:${c.id}`, need)).join('')}</tr>`).join('')}</table>
    </section>
    <section class="inv"><h2>투톤 장식 (하트·별·링)</h2>
      <table><tr><th>색</th>${accShapes.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr>
      ${CAT.colors.map(c => `<tr><td><span class="sw" style="background:${c.hex}"></span>${esc(c.name)}</td>${accShapes.map(s => invCell(`acc:${s.k}:${c.id}`, need)).join('')}</tr>`).join('')}</table>
    </section>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <section class="inv"><h2>본체</h2><table><tr><th>색</th><th>재고</th><th>최소</th></tr>${bodyColors.map(c => row('body:' + c.id, c.name, c.hex)).join('')}</table></section>
      <section class="inv"><h2>스위치 축</h2><table><tr><th>축</th><th>재고</th><th>최소</th></tr>${CAT.sw.map(s => row('sw:' + s.id, `${s.name} (${s.type})`, s.hex)).join('')}</table></section>
      <section class="inv"><h2>테두리 · 기타</h2><table><tr><th>부품</th><th>재고</th><th>최소</th></tr>
        ${CAT.rims.map(r => row('rim:' + r.k, '테두리 ' + r.name, r.hex)).join('')}
        ${row('etc:magnet', '자석')}
        ${extra.map(k => row(k, DB.inv[k].name || k)).join('')}
      </table>
      <p><button class="btn" id="add-part">부품 추가</button></p></section>
    </div>`;
  $('#add-part').onclick = () => {
    const name = prompt('추가할 부품 이름 (예: 키링 고리, 포장 박스)');
    if (!name) return;
    DB.inv['etc:' + Date.now()] = {name: name.trim(), qty: 0};
    save(); renderInv();
  };
}

// ---- 탭 / 설정 ----
document.querySelector('nav').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  for (const t of ['orders', 'inv', 'settings']) $('#tab-' + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === 'settings') { $('#set-magnet').value = DB.settings.magnet; renderCloud(); }
  render();
};
$('#set-magnet').onchange = e => { DB.settings.magnet = Math.max(0, Number(e.target.value) || 0); save(); };
$('#backup').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB)], {type: 'application/json'}));
  a.download = `sedal-orders-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};
$('#restore').onchange = async e => {
  try {
    const v = JSON.parse(await e.target.files[0].text());
    if (!v.orders) throw 0;
    if (!confirm('지금 데이터를 백업 파일 내용으로 바꿀까요?')) return;
    DB = Object.assign(emptyDB(), v); save(); alert('불러왔어요'); render();
  } catch (_) { alert('백업 파일이 아니에요'); }
};
$('#wipe').onclick = () => {
  if (prompt(`주문과 재고 데이터를 모두 지워요${cloudReady ? ' (클라우드에서도 지워져서 다른 기기에서도 사라져요)' : ''}. 계속하려면 "삭제"라고 입력해 주세요`) !== '삭제') return;
  DB = emptyDB(); save(); render();
};

render();
loadDecoder();
cloudStart();
</script>
</body>
</html>
